name: CI

on:
  push:
    branches: [ main, temp_main ]
  pull_request:
    branches: [ main, temp_main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify dependencies
        run: go mod download

      - name: Go Format Check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted files found:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Go Build
        run: go build -v ./...

      - name: Go Test
        run: go test -v ./...
